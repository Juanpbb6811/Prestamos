spring.application.name=prestamos
server.port=${PORT:8080}

# ==========================================================
# CONEXIÓN A SUPABASE (Usando Session Pooler)
# ==========================================================
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require
spring.datasource.username=postgres.uaybqnqsydwutmtvphfq
spring.datasource.password=eN8vxpvZ2bY33lut
spring.datasource.driver-class-name=org.postgresql.Driver

# Control del pool de conexiones para evitar saturar el límite de Supabase
spring.datasource.hikari.maximum-pool-size=5

# ==========================================================
# CREACIÓN AUTOMÁTICA DE TABLAS (JPA / HIBERNATE)
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================================
# MENSAJES DE ERROR CLAROS PARA SWAGGER / REGLAS DE NEGOCIO
# ==========================================================
server.error.include-message=always
server.error.include-binding-errors=always